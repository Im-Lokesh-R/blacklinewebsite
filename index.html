<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>BLACK LINE | Detailing Studio — Detailing | Protection | Perfection</title>
    <meta
      name="description"
      content="BLACK LINE is a premium car detailing, protection, and customization studio in Chennai. Ceramic coating, PPF, paint correction, vinyl wrapping, and more."
    />
    <meta name="keywords" content="car detailing, ceramic coating, ppf, paint correction, vinyl wrapping, car wash, chennai detailing" />
    <meta name="author" content="BLACK LINE Detailing Studio" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BLACK LINE | Detailing Studio" />
    <meta property="og:description" content="Detailing | Protection | Perfection. Premium car detailing, ceramic coating, and PPF in Chennai." />
    <meta property="og:image" content="/images/og.jpg" />
    <meta property="og:url" content="https://blackline.netlify.app" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BLACK LINE | Detailing Studio" />
    <meta name="twitter:description" content="Detailing | Protection | Perfection." />
    <meta name="twitter:image" content="/images/og.jpg" />

    <!-- Google Fonts: Chakra Petch (display) + Inter Tight (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- LocalBusiness JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoWash",
        "name": "BLACK LINE Detailing Studio",
        "description": "Premium car detailing, protection, and customization studio.",
        "image": "/images/og.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "No. 12, GST Road",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600032",
          "addressCountry": "IN"
        },
        "telephone": ["+91 99403 31994", "+91 88258 02692", "+91 97909 95708"],
        "openingHours": ["Mo-Sa 09:00-19:00"],
        "priceRange": "$$"
      }
    </script>

    <!-- Netlify Forms static shim (hidden, so Netlify detects the form at build time) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="car" />
      <select name="service">
        <option value="Ceramic Coating">Ceramic Coating</option>
        <option value="PPF">PPF</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
